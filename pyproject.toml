[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cailp-social"
version = "0.1.0"
description = "Counterfactual Attention-Based Inverse Link Prediction for Social Network Sparsification"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "torch>=2.1",
  "torch-geometric>=2.4",
  "numpy",
  "scipy",
  "scikit-learn",
  "networkx",
  "pyyaml",
  "pandas",
  "matplotlib",
  "statsmodels",
  "python-louvain",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
